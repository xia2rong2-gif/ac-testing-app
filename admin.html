<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>管理后台 - 伊莱克斯测试查询</title>
<style>
:root{--bg:#f2f2f6;--card:#fff;--primary:#007aff;--text:#1c1c1e;--secondary:#8e8e93;--border:#e5e5ea;--radius:12px;--danger:#ff3b30}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);font-size:16px;padding:16px;max-width:640px;margin:0 auto}
h1{font-size:20px;font-weight:600;margin-bottom:16px}
.section{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.section h2{font-size:16px;font-weight:600;margin-bottom:12px}
input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);font-size:15px;outline:none;margin-bottom:8px}
input:focus{border-color:var(--primary)}
button{padding:10px 20px;border-radius:10px;border:none;font-size:15px;cursor:pointer;min-height:44px}
.btn-primary{background:var(--primary);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-secondary{background:var(--border);color:var(--text)}
.btn-small{padding:6px 12px;font-size:13px;min-height:auto}
.mt-8{margin-top:8px}
.mb-8{margin-bottom:8px}
.flex{display:flex;gap:8px;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.err{color:var(--danger);font-size:14px;margin-top:8px}
.success{color:#34c759;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--border)}
th{font-weight:500;color:var(--secondary)}
.tag{padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500}
.tag-active{background:#34c75920;color:#34c759}
.tag-inactive{background:var(--danger);color:#fff}
code{font-size:13px;background:var(--bg);padding:2px 6px;border-radius:4px;word-break:break-all}
#loginForm,#dashboard{display:block}
#dashboard{display:none}
</style>
</head>
<body>
<h1>管理后台</h1>

<div id="loginForm" class="section">
  <h2>管理员登录</h2>
  <input type="password" id="adminPassword" placeholder="输入管理员密码" autocomplete="current-password">
  <button class="btn-primary" onclick="adminLogin()">登录</button>
  <div id="loginErr" class="err"></div>
</div>

<div id="dashboard">
  <div class="section">
    <div class="flex-between mb-8">
      <h2>邀请码管理</h2>
      <button class="btn-primary btn-small" onclick="generateCode()">生成新码</button>
    </div>
    <div class="flex mb-8" style="flex-wrap:wrap">
      <input id="customCode" placeholder="自定义码（可选）" style="width:auto;flex:1;min-width:120px;margin:0">
      <input id="maxUses" type="number" value="3" style="width:70px;margin:0" min="1" max="99">
      <span style="font-size:13px;color:var(--secondary)">次</span>
    </div>
    <div id="codeList"></div>
    <div id="genResult" class="success mt-8"></div>
  </div>

  <div class="section">
    <div class="flex-between mb-8">
      <h2>已注册用户</h2>
      <button class="btn-secondary btn-small" onclick="loadUsers()">刷新</button>
    </div>
    <div id="userList"><div style="color:var(--secondary);font-size:14px">加载中...</div></div>
  </div>
</div>

<script>
let adminToken = sessionStorage.getItem('admin_token');
if (adminToken) document.getElementById('loginForm').style.display = 'none';
if (adminToken) document.getElementById('dashboard').style.display = 'block';

async function adminLogin() {
  const pw = document.getElementById('adminPassword').value;
  const err = document.getElementById('loginErr');
  try {
    const r = await fetch('/api/admin-login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({password: pw}) });
    const d = await r.json();
    if (d.success) {
      adminToken = d.token;
      sessionStorage.setItem('admin_token', d.token);
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadCodes(); loadUsers();
    } else {
      err.textContent = d.message || '登录失败';
    }
  } catch(e) { err.textContent = '网络错误'; }
}

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: {'Content-Type':'application/json', Authorization: `Bearer ${adminToken}`, ...opts.headers } });
  return r.json();
}

async function generateCode() {
  const custom = document.getElementById('customCode').value.trim().toUpperCase();
  const maxUses = parseInt(document.getElementById('maxUses').value) || 3;
  const body = { max_uses: maxUses };
  if (custom) body.code = custom;

  const d = await api('/api/admin/codes', { method: 'POST', body: JSON.stringify(body) });
  const el = document.getElementById('genResult');
  if (d.success) {
    el.innerHTML = `新码已生成: <code>${d.code}</code>`;
    loadCodes();
  } else {
    el.innerHTML = `<span style="color:var(--danger)">${d.message || '生成失败'}</span>`;
  }
}

async function revokeCode(code) {
  if (!confirm(`确定撤销 ${code}？`)) return;
  const d = await api('/api/admin/codes', { method: 'DELETE', body: JSON.stringify({ code }) });
  if (d.success) loadCodes();
}

async function loadCodes() {
  const d = await api('/api/admin/codes');
  const el = document.getElementById('codeList');
  if (!d.success) { el.innerHTML = '<div class="err">加载失败</div>'; return; }
  if (!d.codes || d.codes.length === 0) { el.innerHTML = '<div style="color:var(--secondary)">暂无邀请码</div>'; return; }

  el.innerHTML = `<table><tr><th>邀请码</th><th>状态</th><th>使用</th><th></th></tr>${d.codes.sort((a,b) => b.created_at - a.created_at).map(c => `<tr>
    <td><code>${c.code}</code></td>
    <td><span class="tag ${c.is_active ? 'tag-active' : 'tag-inactive'}">${c.is_active ? '有效' : '已撤销'}</span></td>
    <td>${c.used_count}/${c.max_uses}</td>
    <td>${c.is_active ? `<button class="btn-danger btn-small" onclick="revokeCode('${c.code}')">撤销</button>` : ''}</td>
  </tr>`).join('')}</table>`;
}

async function loadUsers() {
  const d = await api('/api/admin/users');
  const el = document.getElementById('userList');
  if (!d.success) { el.innerHTML = '<div class="err">加载失败</div>'; return; }
  if (!d.users || d.users.length === 0) { el.innerHTML = '<div style="color:var(--secondary)">暂无注册记录</div>'; return; }

  el.innerHTML = `<table><tr><th>邀请码</th><th>IP</th><th>时间</th></tr>${d.users.map(u => `<tr>
    <td><code>${u.code_used}</code></td>
    <td style="font-size:12px;color:var(--secondary)">${u.ip || '-'}</td>
    <td style="font-size:12px;color:var(--secondary)">${new Date(u.created_at).toLocaleString('zh-CN')}</td>
  </tr>`).join('')}</table>`;
}

if (adminToken) { loadCodes(); loadUsers(); }
</script>
</body>
</html>
